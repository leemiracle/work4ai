# 故事卡模板 · 复制即用
# 路径: story-primitives/story_card_template.yaml
# 用法: cp 这个文件, 改 card_id/title/burke/tension/arc, 推进 status

card_id: UNIVERSE-00           # 如 NLP-08, MEM-01. 同宇宙内串成链
title: 一句话标题
universe: universe-xxx          # 所属宇宙

burke:
  scene: 场景-在哪里/什么前提下
  agent: 行动者-谁/什么在动
  agency: 手段-用什么概念/工具/API
  act: 行动-发生了什么转变
  purpose: 目的-为了解决什么

tension: agent 想要 X, 但遇到 Y   # 没有冲突就没有故事

arc:                            # McKee 三幕 (可细分)
  - 第一幕-建立: 情境与冲突浮现
  - 第二幕-冲突: 尝试-失败-转折
  - 第三幕-解决: 转变与新平衡

status: pending                 # pending | draft | review | done | deprecated
next_card: null                 # 完成本卡后推进到哪张
refs:                           # 引用 (作者, 标题, 年份) - 强制可追溯
  - "作者, 标题, 年份"

prompt_hint: ""                 # 可选: 给 LLM 的额外生成约束
updated: 2026-08-13
