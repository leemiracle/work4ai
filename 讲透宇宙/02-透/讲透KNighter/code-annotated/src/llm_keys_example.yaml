# =============================================================================
# 模块定位：src/llm_keys_example.yaml —— LLM API 凭据配置的示例模板
# 论文映射：论文 §5 默认模型 O3-mini（openai_key），消融另测 GPT-4o /
#           DeepSeek-R1（deepseek_key）/ Gemini-2-flash（google_key）——本文件
#           的每个 key 位即对应一个曾参与评测的供应商。
# 管线角色：复制为 llm_keys.yaml 后由 src/model.py 读取；key 文件路径写在
#           config.yaml 的 key_file 字段（见 config-example.yaml）。
# 注意：本文件是示例（值全是占位符），真实凭据文件 llm_keys.yaml 已被 .gitignore 忽略。
# =============================================================================
# Simple LLM configuration

# API Keys（各供应商 key，均由 src/model.py 按需读取）
openai_key: "sk-..."
claude_key: "sk-ant-..."
google_key: "AIza..."
deepseek_key: "sk-..."

# For local models (optional)
# In config, use "local:model_name" format to use local models
# Like "local:openai/gpt-oss-120b"
# 本地模型端点（vLLM 等 OpenAI 兼容服务）：config.yaml 里 model 写 "local:模型名" 即走这里
base_url: "http://localhost:8000/v1"
api_key: "dummy"
