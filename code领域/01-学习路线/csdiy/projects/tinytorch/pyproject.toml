[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "tinytorch"
version = "1.0.0"
description = "Deep learning framework from scratch (参照 micrograd + PyTorch)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "csdiy"}]
keywords = ["deep-learning", "autograd", "neural-network", "pytorch", "micrograd"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-benchmark"]

[tool.setuptools]
packages = ["tinytorch"]

[project.urls]
Documentation = "https://github.com/csdiy/csdiy/blob/master/projects/tinytorch/README.md"
